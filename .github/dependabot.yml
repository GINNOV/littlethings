# Dependabot configuration for the littlethings monorepo.
#
# Amiga/aMiLa/Dataset/** is a vendored third-party corpus (training data), not
# code we ship, so it is excluded from Dependabot scans. Version-update PRs are
# disabled (open-pull-requests-limit: 0); Dependabot security updates are
# unaffected by this file.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/**"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    exclude-paths:
      - "Amiga/aMiLa/Dataset/**"
  - package-ecosystem: pip
    directories: ["/**"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    exclude-paths:
      - "Amiga/aMiLa/Dataset/**"
  - package-ecosystem: uv
    directories: ["/**"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    exclude-paths:
      - "Amiga/aMiLa/Dataset/**"
