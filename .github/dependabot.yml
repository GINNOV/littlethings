version: 2
updates:
  # Keep vendored source corpora and generated build output out of Dependabot scans.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pr-limit: 0
    exclude-paths:
      - "Amiga/aMiLa/Dataset/**"
      - "Hardware/Flume/flume-dashboard/.next/**"
      - "Web_Apps/xbook-console/.next/**"
    ignore:
      - dependency-name: "*"

  # Disable both version and security updates for xbook-console Node dependencies
  - package-ecosystem: "npm"
    directory: "/Web_Apps/xbook-console"
    schedule:
      interval: "monthly"
    open-pr-limit: 0
    ignore:
      - dependency-name: "*"

  # Disable both version and security updates for xbook-console Rust/Tauri dependencies
  - package-ecosystem: "cargo"
    directory: "/Web_Apps/xbook-console/src-tauri"
    schedule:
      interval: "monthly"
    open-pr-limit: 0
    ignore:
      - dependency-name: "*"
