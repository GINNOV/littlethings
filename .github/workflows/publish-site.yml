name: Publish Hugo site

on:
  push:
    branches:
      - master
    paths:
      - site/**
      - .github/workflows/publish-site.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-hugo-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Build site
        run: hugo --source site --destination "${RUNNER_TEMP}/littlethings-public" --cleanDestinationDir

      - name: Publish gh-pages branch
        env:
          PUBLISH_DIR: ${{ runner.temp }}/littlethings-gh-pages
        run: |
          set -euo pipefail

          git fetch origin gh-pages
          git worktree add --detach "$PUBLISH_DIR" origin/gh-pages

          find "$PUBLISH_DIR" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "${RUNNER_TEMP}/littlethings-public/." "$PUBLISH_DIR/"
          touch "$PUBLISH_DIR/.nojekyll"

          git -C "$PUBLISH_DIR" config user.name 'github-actions[bot]'
          git -C "$PUBLISH_DIR" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$PUBLISH_DIR" add --all

          if git -C "$PUBLISH_DIR" diff --cached --quiet; then
            echo 'The generated site is unchanged.'
            exit 0
          fi

          git -C "$PUBLISH_DIR" commit -m "Deploy Hugo site from ${GITHUB_SHA}"
          git -C "$PUBLISH_DIR" push origin HEAD:gh-pages
