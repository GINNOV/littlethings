<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Interactive Dental Chart</title>
        <style>
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                background-color: #f0f2f5;
                padding: 20px;
                color: #333;
            }

            h1 {
                margin-bottom: 20px;
                color: #2c3e50;
            }

            /* Control Panel Styling */
            .controls-panel {
                background: white;
                padding: 20px;
                border-radius: 12px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 15px;
                width: 100%;
                max-width: 800px;
                margin-bottom: 25px;
            }

            .calibration-panel {
                background: #e8f4fc;
                border: 1px solid #b3d7ff;
                padding: 20px;
                border-radius: 12px;
                width: 100%;
                max-width: 800px;
                margin-bottom: 25px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .control-group {
                display: flex;
                flex-direction: column;
                gap: 5px;
            }

            label {
                font-size: 0.9em;
                font-weight: 600;
                color: #555;
            }

            select,
            input[type="color"],
            input[type="range"],
            textarea {
                padding: 8px;
                border: 1px solid #ddd;
                border-radius: 6px;
                font-size: 14px;
                width: 100%;
                box-sizing: border-box;
            }

            input[type="range"] {
                padding: 0;
            }

            textarea {
                font-family: monospace;
                resize: vertical;
                background-color: #fff;
            }

            .checkbox-group {
                flex-direction: row;
                align-items: center;
                gap: 10px;
                padding-top: 24px; /* Align with other inputs */
            }

            .checkbox-group input {
                width: auto;
                margin: 0;
                cursor: pointer;
            }

            /* Chart Area Styling */
            .chart-wrapper {
                position: relative;
                max-width: 650px;
                width: 100%;
                background: white;
                border-radius: 8px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
                overflow: hidden;
                border: 1px solid #eee;
                cursor: crosshair; /* Indicates clickable area */
            }

            .chart-image {
                width: 100%;
                height: auto;
                display: block;
                user-select: none; /* Prevents image highlighting on click */
            }

            /* SVG Overlay */
            .overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
            }

            #selection-circle {
                transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
                opacity: 0;
            }
        </style>
    </head>
    <body>
        <h1>Dental Chart Selector</h1>

        <div class="controls-panel">
            <!-- Tooth Selection -->
            <div class="control-group">
                <label for="tooth-selector">Select Tooth (FDI):</label>
                <select id="tooth-selector">
                    <option value="">-- Choose Tooth --</option>
                </select>
            </div>

            <!-- Color Picker -->
            <div class="control-group">
                <label for="color-picker">Circle Color:</label>
                <input type="color" id="color-picker" value="#2ecc71" />
            </div>

            <!-- Size Slider -->
            <div class="control-group">
                <label for="size-slider">Circle Size:</label>
                <input
                    type="range"
                    id="size-slider"
                    min="1"
                    max="10"
                    value="3.5"
                    step="0.5"
                />
            </div>

            <!-- Fill Toggle -->
            <div class="control-group checkbox-group">
                <input type="checkbox" id="fill-check" />
                <label for="fill-check" style="cursor: pointer"
                    >Fill Circle?</label
                >
            </div>
        </div>

        <!-- Calibration Panel -->
        <div class="calibration-panel">
            <h3 style="margin: 0 0 10px 0; color: #2980b9">Calibration Mode</h3>
            <div
                style="
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    margin-bottom: 10px;
                "
            >
                <input
                    type="checkbox"
                    id="calib-mode"
                    style="transform: scale(1.2)"
                />
                <label for="calib-mode" style="cursor: pointer; color: #d35400"
                    >Enable Manual Calibration</label
                >
            </div>
            <p style="margin: 0; font-size: 0.9em; color: #666">
                <strong>Instructions:</strong> 1. Check the box above. 2. Select
                a tooth in the dropdown. 3. Click the correct location on the
                image. The coordinates below will update.
            </p>
            <div class="control-group" style="margin-top: 10px">
                <label for="config-output">Current Coordinates (JSON):</label>
                <textarea id="config-output" rows="4" readonly></textarea>
            </div>
        </div>

        <div class="chart-wrapper">
            <!-- Added onerror fallback to show a placeholder if the local file is missing -->
            <img
                src="image_81fb2f.png"
                alt="Dental Chart"
                class="chart-image"
                onerror="
                    this.onerror = null;
                    this.src =
                        'https://placehold.co/600x400?text=Image+Not+Found+in+Folder';
                "
            />

            <svg
                class="overlay"
                viewBox="0 0 100 100"
                preserveAspectRatio="none"
            >
                <circle id="selection-circle" cx="0" cy="0" r="3.5" />
            </svg>
        </div>

        <script>
            // --- Configuration ---
            const elements = {
                select: document.getElementById("tooth-selector"),
                color: document.getElementById("color-picker"),
                size: document.getElementById("size-slider"),
                fill: document.getElementById("fill-check"),
                circle: document.getElementById("selection-circle"),
                wrapper: document.querySelector(".chart-wrapper"),
                calibCheck: document.getElementById("calib-mode"),
                output: document.getElementById("config-output"),
            };

            // Standard FDI Tooth Coordinates (Percentages relative to image size)
            // Updated with calibrated coordinates provided by user
            const toothMap = {
                11: { x: 46.4, y: 10.7 },
                12: { x: 41.8, y: 11.4 },
                13: { x: 38.6, y: 13.5 },
                14: { x: 35, y: 16 },
                15: { x: 31.8, y: 20.3 },
                16: { x: 30, y: 25.9 },
                17: { x: 28.3, y: 32.1 },
                18: { x: 27.8, y: 38.7 },
                21: { x: 51.6, y: 11.1 },
                22: { x: 56.4, y: 12 },
                23: { x: 59.7, y: 13.5 },
                24: { x: 61.7, y: 16.3 },
                25: { x: 65.1, y: 20.1 },
                26: { x: 66.5, y: 25.5 },
                27: { x: 68.5, y: 32.2 },
                28: { x: 68.9, y: 38.5 },
                31: { x: 50.5, y: 88.7 },
                32: { x: 54.1, y: 88.8 },
                33: { x: 58.1, y: 87 },
                34: { x: 62, y: 84.5 },
                35: { x: 64.5, y: 80.1 },
                36: { x: 67.1, y: 74.1 },
                37: { x: 68.2, y: 67.5 },
                38: { x: 69.1, y: 61.8 },
                41: { x: 46.4, y: 88.8 },
                42: { x: 42.1, y: 88.5 },
                43: { x: 39, y: 86.2 },
                44: { x: 35.2, y: 84.5 },
                45: { x: 30.6, y: 75.5 },
                46: { x: 30.1, y: 73.8 },
                47: { x: 28, y: 68.4 },
                48: { x: 27.5, y: 61.8 },
            };

            // --- Initialization ---
            function init() {
                // Populate Select Options
                Object.keys(toothMap)
                    .sort()
                    .forEach((num) => {
                        const opt = document.createElement("option");
                        opt.value = num;
                        opt.textContent = `Tooth ${num}`;
                        elements.select.appendChild(opt);
                    });

                // Add Event Listeners
                elements.select.addEventListener("change", updateCircle);
                elements.color.addEventListener("input", updateStyle);
                elements.size.addEventListener("input", updateStyle);
                elements.fill.addEventListener("change", updateStyle);

                // Click-to-select logic
                elements.wrapper.addEventListener("click", handleChartClick);

                // Initial Output
                updateConfigOutput();
                updateStyle();
            }

            // --- Logic ---

            function handleChartClick(e) {
                const rect = elements.wrapper.getBoundingClientRect();
                // Calculate click position as percentage
                const clickX = ((e.clientX - rect.left) / rect.width) * 100;
                const clickY = ((e.clientY - rect.top) / rect.height) * 100;

                // CHECK CALIBRATION MODE
                if (elements.calibCheck.checked) {
                    const selectedTooth = elements.select.value;
                    if (!selectedTooth) {
                        alert(
                            "⚠️ Please select a specific tooth from the dropdown list first, then click on the chart to set its location.",
                        );
                        return;
                    }

                    // Update the map with new coordinates
                    toothMap[selectedTooth] = {
                        x: parseFloat(clickX.toFixed(1)),
                        y: parseFloat(clickY.toFixed(1)),
                    };

                    // Move circle to new location and update output
                    updateCircle();
                    updateConfigOutput();
                    return;
                }

                // NORMAL MODE (Click to Select)
                let closestTooth = null;
                let minDistance = Infinity;
                // Threshold for clicking (radius of sensitivity) - roughly 5-6% of image width
                const threshold = 6;

                for (const [toothNum, pos] of Object.entries(toothMap)) {
                    // Calculate Euclidean distance
                    const dist = Math.sqrt(
                        Math.pow(clickX - pos.x, 2) +
                            Math.pow(clickY - pos.y, 2),
                    );

                    if (dist < minDistance) {
                        minDistance = dist;
                        closestTooth = toothNum;
                    }
                }

                // If the closest tooth is within the clickable threshold, select it
                if (closestTooth && minDistance <= threshold) {
                    elements.select.value = closestTooth;
                    updateCircle();
                }
            }

            function updateCircle() {
                const tooth = elements.select.value;
                if (tooth && toothMap[tooth]) {
                    const pos = toothMap[tooth];
                    elements.circle.setAttribute("cx", pos.x);
                    elements.circle.setAttribute("cy", pos.y);
                    elements.circle.style.opacity = "1";
                } else {
                    elements.circle.style.opacity = "0";
                }
            }

            function updateStyle() {
                const color = elements.color.value;
                const size = elements.size.value;
                const isFilled = elements.fill.checked;

                elements.circle.setAttribute("r", size);

                if (isFilled) {
                    elements.circle.style.fill = color;
                    elements.circle.style.fillOpacity = "0.5"; // Semi-transparent fill
                    elements.circle.style.stroke = color;
                    elements.circle.style.strokeWidth = "1";
                } else {
                    elements.circle.style.fill = "none";
                    elements.circle.style.stroke = color;
                    elements.circle.style.strokeWidth = "1.5"; // Thinner outline
                }
            }

            function updateConfigOutput() {
                elements.output.value = JSON.stringify(toothMap, null, 4);
            }

            // Start
            init();
        </script>
    </body>
</html>
