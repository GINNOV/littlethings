services:
    # The Database: Stores video metadata, scene info, and vector embeddings
    db:
        image: ankane/pgvector:latest # Official Postgres image with Vector extension pre-installed
        container_name: sentinel_db
        restart: always
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
            POSTGRES_DB: video_db
        ports:
            - "5432:5432" # Exposes DB to localhost so your Python scripts can reach it
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U user -d video_db"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
