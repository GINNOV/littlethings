[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amiga_lm"
version = "0.1.0"
description = "Amiga-focused Large Language Model fine-tuning project"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
keywords = ["machine-learning", "nlp", "fine-tuning", "transformers", "amiga"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies for training on any platform, including Apple Silicon
dependencies = [
    "torch>=2.1.0",
    "transformers~=4.42.0",
    "datasets~=2.19.0",
    "accelerate~=0.31.0",
    "peft~=0.11.0",
    "trl~=0.9.0",
    "sentencepiece~=0.2.0",
    # Additional common ML dependencies
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "wandb>=0.15.0", # For experiment tracking
]

[project.optional-dependencies]
# Dependencies for NVIDIA GPU-specific features like 4-bit quantization
nvidia = [
    "bitsandbytes~=0.43.0",
]

dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.0.0",
]

jupyter = [
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "ipywidgets>=8.0.0",
    "notebook>=7.0.0",
]

evaluation = [
    "evaluate>=0.4.0",
    "rouge-score>=0.1.2",
]

# An 'all' extra to install everything for development
all = [
    "amiga_lm[nvidia,dev,jupyter,evaluation]",
]

[project.urls]
Homepage = "https://github.com/ginnov/amiga-lm"
Repository = "https://github.com/ginnov/amiga-lm.git"
Issues = "https://github.com/ginnov/amiga-lm/issues"

[tool.setuptools.packages.find]
where = ["src"]

# --- Tool Configurations  ---

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]