[paths]
source = "amiga_workspace/main.s"
build_dir = "build/amiga"
artifact = "build/amiga/main"
disk_image = "build/amiga/main.adf"
startup_sequence = "amiga_workspace/startup-sequence"
emulator_log = "build/amiga/vamigaweb.log"
memory_dump = "build/amiga/memdump.bin"
disk_template = "amiga_workspace/adf/system_template.adf"
kick_rom_dir = "roms"
kick_rom_name = "Kickstart v1.3 r34.005 (1987-12)(Commodore)(A500-A1000-A2000-CDTV).rom"
vamiga_report = "build/amiga/vamigaweb_report.json"
emulator_screenshot = "build/amiga/emulator_capture.png"
report = "build/amiga/report.json"

[commands]
# Example with vasm:
# assemble = "vasmm68k_mot -Fhunkexe -kick1hunks -o {artifact} {source}"
assemble = "vasmm68k_mot -m68000 -Fhunkexe -kick1hunks -nosym -o {artifact} {source}"

# Package by cloning a full system template ADF when available, then updating payload files.
# Fallback: create a minimal bootable DOS disk if no template is present.
package = "TOOLS_BIN=\"${{AMIGA_TOOLS_BIN:-$HOME/.venv/bin}}\"; XDFTOOL=\"${{XDFTOOL:-$TOOLS_BIN/xdftool}}\"; if [ -f '{disk_template}' ]; then cp '{disk_template}' '{disk_image}' && \"$XDFTOOL\" -f '{disk_image}' write '{startup_sequence}' s/startup-sequence + write '{artifact}' main; else \"$XDFTOOL\" -f '{disk_image}' create + format MIGA + boot install + makedir s + write '{startup_sequence}' s/startup-sequence + write '{artifact}' main; fi"

emulate = "VAMIGA_DISK_IMAGE='{disk_image}' VAMIGA_KICK_ROM='{kick_rom}' VAMIGA_SECONDS=8 VAMIGA_REPORT_PATH='{vamiga_report}' VAMIGA_SCREENSHOT_PATH='{emulator_screenshot}' node amiga_workspace/run_vamigaweb.js"

# Deterministic CPU-level verification run in vamos.
verify = "TOOLS_BIN=\"${{AMIGA_TOOLS_BIN:-$HOME/.venv/bin}}\"; VAMOS=\"${{VAMOS:-$TOOLS_BIN/vamos}}\"; mkdir -p {build_dir}/vamos-vols && \"$VAMOS\" --skip-configs --vols-base-dir {build_dir}/vamos-vols -V root:{build_dir} -p root: --cwd root: -H ignore root:main"

[timeouts]
assemble_seconds = 30
emulate_seconds = 20
verify_seconds = 10

[emulator]
# Some emulator wrappers may return non-zero on controlled exit.
allow_nonzero_exit = true
# Some emulators are intentionally killed by timeout after smoke-run seconds.
allow_timeout_exit = true
# Ensure log parsing is from this run only.
clear_log_before_run = true

[verify]
allow_nonzero_exit = false
allow_timeout_exit = false

[metric]
base_score = 0.0
assemble_weight = 0.25
emulate_weight = 0.20
verify_weight = 0.25
checks_weight = 0.30

[crash_detection]
patterns = [
  "Software Failure",
  "Guru Meditation",
  "Illegal instruction",
  "Address Error",
  "Bus Error",
]

[[checks.log_regex]]
name = "no_guru_meditation"
pattern = "Guru Meditation"
must_match = false
ignore_case = true
enabled = true

[[checks.log_regex]]
name = "vamiga_ready"
pattern = "VAMIGA_READY yes"
must_match = true
ignore_case = true
enabled = true

[[checks.log_regex]]
name = "vamiga_df0_inserted"
pattern = "VAMIGA_DF0 1"
must_match = true
ignore_case = true
enabled = true

[[checks.log_regex]]
name = "vamiga_cycles_progress"
pattern = "VAMIGA_CPU_CYCLES [1-9][0-9]*"
must_match = true
ignore_case = false
enabled = true

[[checks.log_regex]]
name = "no_vamiga_runner_error"
pattern = "VAMIGA_ERROR|VAMIGA_FATAL"
must_match = false
ignore_case = true
enabled = true

[[checks.verify_regex]]
name = "no_vamos_error"
pattern = "ERROR:"
must_match = false
ignore_case = false
enabled = true

# Enable once your program writes a deterministic boot marker to emulator logs.
[[checks.log_regex]]
name = "boot_marker"
pattern = "AUTORESEARCH_OK"
must_match = true
ignore_case = true
enabled = false

# Optional memory-state check. Keep disabled until emulator dump path is wired.
[[checks.memory]]
name = "entry_guard_bytes"
offset = 0
bytes_hex = "4E714E71"
enabled = false
