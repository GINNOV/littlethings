<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Amiga Producer Improvements</title>
  <desc id="desc">Infographic comparing the previous prompt-to-text flow with the new model-backed Amiga code producer flow.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6f78"/>
      <stop offset="0.55" stop-color="#704f9f"/>
      <stop offset="1" stop-color="#b8495b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <style>
      .bg { fill: #f6f4ef; }
      .ink { fill: #202124; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .muted { fill: #585b61; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .small { font-size: 22px; }
      .body { font-size: 25px; }
      .label { font-size: 26px; font-weight: 700; }
      .title { font-size: 42px; font-weight: 800; }
      .subtitle { font-size: 24px; }
      .card { fill: #ffffff; stroke: #d9d4ca; stroke-width: 2; rx: 8; }
      .old { fill: #8f3d4a; }
      .new { fill: #1f6f78; }
      .gold { fill: #b27a20; }
      .line { stroke: #2e343b; stroke-width: 5; stroke-linecap: round; fill: none; }
      .softline { stroke: #c9c2b7; stroke-width: 3; stroke-linecap: round; fill: none; }
      .pill { fill: #ece7dc; rx: 8; }
      .check { fill: none; stroke: #1f7a55; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .cross { stroke: #9a3544; stroke-width: 6; stroke-linecap: round; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <rect x="0" y="0" width="1280" height="118" fill="url(#header)"/>
  <text class="ink title" x="50" y="58" fill="#ffffff">Amiga Playground Producer Upgrade</text>
  <text class="ink subtitle" x="52" y="92" fill="#f8f4ec">From plausible snippets to structured, patchable, verified Amiga programs</text>

  <g filter="url(#shadow)">
    <rect class="card" x="48" y="150" width="548" height="500"/>
    <rect class="card" x="684" y="150" width="548" height="500"/>
  </g>

  <text class="ink label old" x="82" y="200">Before</text>
  <text class="muted body" x="82" y="238">Prompt-to-text generation</text>

  <g transform="translate(82 275)">
    <line class="cross" x1="2" y1="5" x2="24" y2="27"/>
    <line class="cross" x1="24" y1="5" x2="2" y2="27"/>
    <text class="ink body" x="48" y="27">No durable source contract</text>

    <line class="cross" x1="2" y1="74" x2="24" y2="96"/>
    <line class="cross" x1="24" y1="74" x2="2" y2="96"/>
    <text class="ink body" x="48" y="96">Follow-ups could overwrite prior work</text>

    <line class="cross" x1="2" y1="143" x2="24" y2="165"/>
    <line class="cross" x1="24" y1="143" x2="2" y2="165"/>
    <text class="ink body" x="48" y="165">Malformed requests could drift to free-form edits</text>

    <line class="cross" x1="2" y1="212" x2="24" y2="234"/>
    <line class="cross" x1="24" y1="212" x2="2" y2="234"/>
    <text class="ink body" x="48" y="234">Compile failures arrived late and noisy</text>

    <line class="cross" x1="2" y1="281" x2="24" y2="303"/>
    <line class="cross" x1="24" y1="281" x2="2" y2="303"/>
    <text class="ink body" x="48" y="303">Coverage declarations could be indirect</text>
  </g>

  <text class="ink label new" x="718" y="200">Now</text>
  <text class="muted body" x="718" y="238">Model-backed agentic code production</text>

  <g transform="translate(718 275)">
    <path class="check" d="M4 18 L14 29 L32 5"/>
    <text class="ink body" x="48" y="27">Embedded AmigaProgramModel contract</text>

    <path class="check" d="M4 87 L14 98 L32 74"/>
    <text class="ink body" x="48" y="96">Same-conversation structured patching</text>

    <path class="check" d="M4 156 L14 167 L32 143"/>
    <text class="ink body" x="48" y="165">Terminal rejections preserve editor state</text>

    <path class="check" d="M4 225 L14 236 L32 212"/>
    <text class="ink body" x="48" y="234">Verifier, runtime observation, compile, and ADF gates</text>

    <path class="check" d="M4 294 L14 305 L32 281"/>
    <text class="ink body" x="48" y="303">Representative routed conversation audits</text>
  </g>

  <path class="line" d="M608 390 C640 360 640 360 672 390"/>
  <path class="line" d="M672 390 L650 378"/>
  <path class="line" d="M672 390 L653 407"/>

  <g transform="translate(190 604)">
    <rect class="pill" x="0" y="0" width="900" height="58"/>
    <text class="muted small" x="24" y="37">Proof path:</text>
    <text class="ink small" x="135" y="37">Prompt routing -> model/source patch -> rejection recovery -> verifier -> runtime evidence -> compile -> bootable ADF</text>
  </g>

  <g transform="translate(50 675)">
    <text class="muted small" x="0" y="0">Scope: app-side integrated producer improvements. Model weights were not retrained in this slice.</text>
  </g>
</svg>
